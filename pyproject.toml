[project]
name = "langchain-multi-agent-research-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "readability-lxml>=0.9",
    "requests==2.31.0",
    "streamlit>1.0.0",
    "tavily-python>=0.3.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
langchain-multi-agent-research-system = "langchain_multi_agent_research_system:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
